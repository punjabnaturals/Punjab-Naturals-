*{box-sizing:border-box}body{margin:0;font:16px/1.6 Georgia,'Times New Roman',serif;color:#222;background:var(--cr)}
h1,h2,h3{color:var(--g);line-height:1.2}a{color:var(--g)}img{max-width:100%;height:auto}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.wrap{max-width:1180px;margin:auto;padding:0 16px}
.ann{background:var(--dg);color:var(--gold);text-align:center;font-size:14px;padding:6px}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0002}
.bar{display:flex;align-items:center;gap:12px;padding:8px 16px;max-width:1180px;margin:auto}
.bar img{width:56px;height:56px;border-radius:50%}nav{display:flex;gap:14px;flex:1;flex-wrap:wrap;font-size:14px}
nav a{text-decoration:none;font-weight:bold}nav a:hover{color:var(--gold)}
.btn{display:inline-block;border:0;border-radius:30px;padding:10px 18px;background:var(--g);color:#fff;cursor:pointer;text-decoration:none;font:bold 14px Arial}
.btn.gold{background:var(--gold);color:var(--dg)}.btn.wa{background:#1a8f4a}.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}
#menu{display:none}@media(max-width:860px){#menu{display:block}nav{display:none;flex-basis:100%;flex-direction:column}nav.open{display:flex}.bar{flex-wrap:wrap}}
.hero{background:linear-gradient(135deg,var(--dg),var(--g));color:#fff;padding:40px 0}.hero .wrap{display:grid;gap:28px;grid-template-columns:1fr 1fr;align-items:center}
.hero h1{color:#fff;font-size:clamp(28px,5vw,48px)}.hero small{color:var(--gold);letter-spacing:3px}.hero img{width:100%;max-width:440px;border-radius:50%;justify-self:center}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}}
section.s{padding:36px 0}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.promise{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.promise div{background:#fff;border-radius:16px;padding:18px;border-top:4px solid var(--gold)}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px #0001;overflow:hidden;display:flex;flex-direction:column}.card .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:17px}.card p{margin:0;font-size:13px;color:#555}.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.card .btn{padding:7px 10px;font-size:12px}
.badge{background:var(--gold);color:var(--dg);font:bold 11px Arial;padding:2px 8px;border-radius:10px;display:inline-block}.demo{font:11px Arial;color:#a33}
.price{font:bold 16px Arial;color:var(--br)}.hs{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}.hs .card{min-width:230px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{padding:9px;border:1px solid #bbb;border-radius:8px;font-size:14px}
footer{background:var(--dg);color:#ddd;padding:30px 0;margin-top:30px}footer a{color:var(--gold)}footer .grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:#fff;z-index:50;padding:16px;transform:translateX(100%);transition:.25s;overflow:auto;box-shadow:-4px 0 20px #0004}#drawer.open{transform:none}

const greet="Assalam-o-Alaikum Punjab Naturals! I would like to order:\n";
const one=(p,q=1)=>greet+`Product: ${p.name}\nSize: ${p.unit}\nQuantity: ${q}\nPrice: ${p.priceStatus==='confirmed'?'PKR '+p.price:'to be confirmed'}\nPlease confirm availability, delivery charges, and total payable amount.`;
let cart=[];try{cart=JSON.parse(localStorage.getItem('pn')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('pn',JSON.stringify(cart))}catch(e){}render()};
const add=id=>{const i=cart.find(x=>x.id===id);i?i.q++:cart.push({id,q:1});save();$('#drawer').classList.add('open')};
const nav=[['Home','#/'],['Shop All','#/shop'],['Organic Products','#/c/organic-natural'],['Natural Oils','#/c/natural-oils'],['Edible Oils','#/c/edible-oils'],['Honey','#/c/honey'],['Dry Fruits','#/c/dry-fruits'],['Special Collections','#/c/special-collections'],['About Us','#/about'],['Contact Us','#/contact']];
const card=p=>`<article class="card"><a href="${url(p)}"><img src="${img(p)}" alt="${esc(p.name)} (placeholder image)" width="400" height="300" loading="lazy"></a><div class="b"><div>${p.featured?'<span class="badge">Featured</span> ':''}${p.isNew?'<span class="badge">New</span> ':''}${p.premium?'<span class="badge">Premium</span>':''}</div><h3>${esc(p.name)}</h3><small>${esc(cat(p.cat).name)}</small><p>${esc(p.desc.slice(0,90))}…</p><p>${esc(p.unit)} · ${esc(p.availability)}</p><div class="price">${price(p)}</div><div class="row"><a class="btn o" href="${url(p)}">View Details</a><button class="btn" data-add="${p.id}">Add to Order</button><a class="btn wa" href="${wa(CONFIG.wa1,one(p))}" target="_blank" rel="noopener">WhatsApp</a></div></div></article>`;
const row=(t,l,href)=>`<section class="s"><div class="wrap"><h2>${t}</h2><div class="hs">${l.slice(0,10).map(card).join('')}</div><p><a class="btn o" href="${href}">View all</a> <a class="btn wa" href="${wa(CONFIG.wa1,greet+'I am interested in: '+t)}" target="_blank" rel="noopener">Order via WhatsApp</a></p></div></section>`;
function chrome(){$('#hdr').innerHTML=`<div class="ann">${esc(CONFIG.announcement)}</div><header><div class="bar"><a href="#/"><img src="${LOGO}" alt="Punjab Naturals logo" width="56" height="56"></a><button id="menu" class="btn o" aria-label="Menu" aria-expanded="false">☰ Menu</button><nav id="nav">${nav.map(n=>`<a href="${n[1]}">${n[0]}</a>`).join('')}</nav><a href="#/shop" aria-label="Search">🔍</a><button class="btn o" id="cartb" aria-label="Order list">🛒 <span id="cc">0</span></button><a class="btn wa" href="${wa(CONFIG.wa1,greet)}" target="_blank" rel="noopener">Order on WhatsApp</a></div></header><aside id="drawer" aria-label="Order list"></aside><a class="btn wa wfix" href="${wa(CONFIG.wa2,greet)}" target="_blank" rel="noopener">💬 WhatsApp</a>`;
const s=CONFIG.social,l=(n,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${n}">${n}</a>`:`<span>${n} (add URL in config.js)</span>`;
$('#ftr').innerHTML=`<footer><div class="wrap grid"><div><img src="${LOGO}" alt="Punjab Naturals" width="90" height="90"><h3 style="color:#fff">Punjab Naturals</h3><p>${CONFIG.slogan}. Natural products selected with honest information and personal service.</p></div><div><h3 style="color:#fff">Shop</h3>${CATEGORIES.map(c=>`<div><a href="#/c/${c.slug}">${c.name}</a></div>`).join('')}</div><div><h3 style="color:#fff">Company</h3>${[['About Us','about'],['Contact Us','contact'],['FAQ','faq'],['Delivery & Shipping','shipping-policy'],['Returns & Refunds','returns-policy'],['Privacy','privacy-policy'],['Terms','terms']].map(x=>`<div><a href="#/${x[1]}">${x[0]}</a></div>`).join('')}</div><div><h3 style="color:#fff">Contact</h3><p><a href="${wa(CONFIG.wa1,greet)}" target="_blank" rel="noopener">Order via WhatsApp 1: ${CONFIG.wa1Show}</a><br><a href="${wa(CONFIG.wa2,greet)}" target="_blank" rel="noopener">Order via WhatsApp 2: ${CONFIG.wa2Show}</a><br><a href="mailto:${CONFIG.email}">${CONFIG.email}</a></p><p>${l('Facebook',s.facebook)} ${l('Instagram',s.instagram)} ${l('TikTok',s.tiktok)} <a href="mailto:${CONFIG.email}" aria-label="Gmail">Gmail</a></p></div></div><p class="wrap" style="font-size:12px">All listings, images and prices are demo content until confirmed. Orders are not confirmed until our team confirms them on WhatsApp.</p></footer>`;
$('#menu').onclick=e=>{const o=$('#nav').classList.toggle('open');e.target.setAttribute('aria-expanded',o)};$('#cartb').onclick=()=>$('#drawer').classList.toggle('open')}
function render(){const d=$('#drawer');if(!d)return;$('#cc').textContent=cart.reduce((a,x)=>a+x.q,0);
const items=cart.map(x=>({p:PRODUCTS.find(p=>p.id===x.id),q:x.q}));const msg=greet+items.map((x,i)=>`${i+1}. ${x.p.name} | ${x.p.unit} | Qty: ${x.q}`).join('\n')+'\nPlease confirm availability, delivery charges, and total payable amount.';
d.innerHTML=`<h2>Your Order List</h2><button class="btn o" onclick="this.parentNode.classList.remove('open')">Close</button>${items.length?items.map(x=>`<p><b>${esc(x.p.name)}</b> (${x.p.unit})<br><button class="btn o" data-q="${x.p.id}:-1">−</button> ${x.q} <button class="btn o" data-q="${x.p.id}:1">+</button> <button class="btn o" data-rm="${x.p.id}">Remove</button></p>`).join('')+`<p class="demo">Prices are not final. Total will be confirmed by our team.</p><a class="btn wa" href="${wa(CONFIG.wa1,msg)}" target="_blank" rel="noopener">Order via WhatsApp 1</a><p></p><a class="btn wa" href="${wa(CONFIG.wa2,msg)}" target="_blank" rel="noopener">Order via WhatsApp 2</a>`:'<p>Your list is empty.</p>'}`}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.add)add(t.dataset.add);if(t.dataset.rm){cart=cart.filter(x=>x.id!==t.dataset.rm);save()}if(t.dataset.q){const[i,n]=t.dataset.q.split(':'),x=cart.find(y=>y.id===i);x.q+=+n;if(x.q<1)cart=cart.filter(y=>y!==x);save()}if(t.id==='more'){shown+=24;list()}});
let shown=24,F=[];
function list(){const q=$('#q').value.toLowerCase(),c=$('#c').value,lo=+$('#lo').value||0,hi=+$('#hi').value||1e9,s=$('#s').value,ft=$('#f').checked;
F=PRODUCTS.filter(p=>(!c||p.cat===c)&&(p.name+' '+cat(p.cat).name+' '+p.type).toLowerCase().includes(q)&&p.price>=lo&&p.price<=hi&&(!ft||p.featured));
if(s==='n')F.sort((a,b)=>a.name.localeCompare(b.name));if(s==='pl')F.sort((a,b)=>a.price-b.price);if(s==='ph')F.sort((a,b)=>b.price-a.price);if(s==='new')F.sort((a,b)=>b.isNew-a.isNew);
$('#cnt').textContent=F.length+' products';$('#res').innerHTML=F.length?F.slice(0,shown).map(card).join(''):'<p>No products found. Try a different search.</p>';$('#more').style.display=F.length>shown?'inline-block':'none'}
function shop(){const fc=document.body.dataset.cat||new URLSearchParams(location.search).get('c')||'';const C=cat(fc);
$('#app').innerHTML=`<div class="wrap"><p class="crumb"><a href="#/">Home</a> › <a href="#/shop">Shop</a>${C?' › '+C.name:''}</p><h1>${C?C.name:'Shop All Natural Products'}</h1>${fc==='B'?'<p class="warn">Cosmetic/botanical oils are for external use, not for eating. Essential oils must be diluted before skin use. Edible oils are listed separately.</p>':''}${fc==='D'?'<p class="warn">Honey must not be given to infants under 12 months.</p>':''}<div class="filters"><input id="q" type="search" placeholder="Search products or categories" aria-label="Search"><select id="c" aria-label="Category"><option value="">All categories</option>${CATEGORIES.map(x=>`<option value="${x.id}" ${x.id===fc?'selected':''}>${x.name}</option>`).join('')}</select><input id="lo" type="number" placeholder="Min PKR" style="width:100px"><input id="hi" type="number" placeholder="Max PKR" style="width:100px"><select id="s" aria-label="Sort"><option value="">Sort</option><option value="n">Name</option><option value="pl">Price low-high</option><option value="ph">Price high-low</option><option value="new">Newest</option></select><label><input id="f" type="checkbox"> Featured</label></div><p id="cnt"></p><div class="grid" id="res"></div><p style="text-align:center"><button class="btn" id="more">Load more</button></p></div>`;
document.querySelectorAll('.filters input,.filters select').forEach(e=>e.oninput=()=>{shown=24;list()});list()}
function product(){const p=PRODUCTS.find(x=>x.id===document.body.dataset.id)||PRODUCTS.find(x=>x.slug===new URLSearchParams(location.search).get('p'));if(!p){$('#app').innerHTML='<div class="wrap"><h1>Product not found</h1><a href="#/shop">Shop all</a></div>';return}
const c=cat(p.cat);document.title=p.metaTitle;const rel=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
$('#app').innerHTML=`<div class="wrap"><p class="crumb"><a href="#/">Home</a> › <a href="#/c/${c.slug}">${c.name}</a> › ${esc(p.name)}</p><div class="pd"><img src="${img(p)}" alt="${esc(p.name)} placeholder image" width="400" height="300"><div><h1>${esc(p.name)}</h1><p>${esc(p.desc)}</p><p class="price">${price(p)}</p><p><b>Net:</b> ${esc(p.unit)} · <b>Status:</b> ${p.availability}</p><ul>${Object.entries(p.specs).map(([k,v])=>`<li><b>${k}:</b> ${esc(v)}</li>`).join('')}<li><b>Product ID:</b> ${p.id}</li></ul><p class="warn"><b>Storage & safety:</b> ${esc(p.safety)}</p><p><button class="btn" data-add="${p.id}">Add to Order</button> <a class="btn wa" href="${wa(CONFIG.wa1,one(p))}" target="_blank" rel="noopener">Order via WhatsApp 1</a> <a class="btn wa" href="${wa(CONFIG.wa2,one(p))}" target="_blank" rel="noopener">Order via WhatsApp 2</a></p></div></div><h2>Related products</h2><div class="grid">${rel.map(card).join('')}</div></div>`}
function home(){const by=(id,n=10)=>PRODUCTS.filter(p=>p.cat===id).slice(0,n);
$('#app').innerHTML=`<section class="hero"><div class="wrap"><div><small>PUNJAB NATURALS</small><h1>Discover Nature. Experience Trust.</h1><p><i>Punjab, The Land of Trust</i></p><p>Welcome to Punjab Naturals, your destination for discovering natural products inspired by the richness and beauty of Punjab. From honey and dry fruits to edible oils, botanical oils, and carefully selected natural essentials, we bring a diverse collection together in one convenient place.</p><p>Our philosophy is simple: nature deserves thoughtful selection, customers deserve honest information, and every order deserves personal attention.</p><a class="btn gold" href="#/shop">Explore Our Products</a> <a class="btn wa" href="${wa(CONFIG.wa1,greet)}" target="_blank" rel="noopener">Order on WhatsApp</a></div><img src="${LOGO}" alt="Punjab Naturals logo" width="440" height="440"></div></section><section class="s"><div class="wrap"><h2>Our Promise to You</h2><div class="promise"><div><h3>Nature-Inspired Selection</h3></div><div><h3>Clear Product Information</h3></div><div><h3>Customer-Focused Service</h3></div><div><h3>Convenient WhatsApp Ordering</h3></div></div></div></section>`+
row('Best-Selling Products (demo: featured picks)',PRODUCTS.filter(p=>p.featured),'#/shop')+row('Honey Collection',by('D'),'#/c/honey')+row('Natural Oils',by('B'),'#/c/natural-oils')+row('Edible Oils',by('C'),'#/c/edible-oils')+row('Organic & Natural Products',by('A'),'#/c/organic-natural')+row('Premium Dry Fruits',by('E'),'#/c/dry-fruits')+row('Special Collections',by('I'),'#/c/special-collections')+row('New Arrivals',PRODUCTS.filter(p=>p.isNew),'#/shop')}
function about(){$('#app').innerHTML=`<section class="wrap pol"><h1>Rooted in Nature. Guided by Trust.</h1><p>Punjab Naturals was created around a simple idea: make discovering natural products easier, more transparent, and more convenient for everyday customers.</p><p>Inspired by Punjab's rich heritage and appreciation for nature, our brand brings together a thoughtfully organized collection of honey, oils, dry fruits, herbs, spices, and natural essentials.</p><p>We believe trust is built through honest communication, clear product details, responsive service, and respect for our customers.</p><p><i>'Punjab, The Land of Trust.'</i></p></section>`}
function contact(){$('#app').innerHTML=`<section class="wrap pol"><h1>Contact Us</h1><p>Email: <a href="mailto:${CONFIG.email}">${CONFIG.email}</a></p><p><a class="btn wa" href="${wa(CONFIG.wa1,greet)}" target="_blank" rel="noopener">Order via WhatsApp 1 (${CONFIG.wa1Show})</a></p><p><a class="btn wa" href="${wa(CONFIG.wa2,greet)}" target="_blank" rel="noopener">Order via WhatsApp 2 (${CONFIG.wa2Show})</a></p></section>`}
function route(){const h=location.hash.replace(/^#\/?/,''),[k,b]=h.split('/'),B=document.body;B.dataset.cat='';B.dataset.id='';let f=home,t='Punjab Naturals | Honey, Natural Oils & Dry Fruits in Pakistan';
if(k==='shop'){f=shop;t='Shop All | Punjab Naturals'}else if(k==='c'){const c=CATEGORIES.find(x=>x.slug===b);if(c){B.dataset.cat=c.id;f=shop;t=c.name+' | Punjab Naturals'}}
else if(k==='p'){const p=PRODUCTS.find(x=>x.slug===b);if(p){B.dataset.id=p.id;f=product;t=p.metaTitle}}
else if(k==='about'){f=about;t='About | Punjab Naturals'}else if(k==='contact'){f=contact;t='Contact | Punjab Naturals'}
else if(['faq','shipping-policy','returns-policy','privacy-policy','terms'].includes(k)){const n=k.replace(/-/g,' ').toUpperCase();t=n+' | Punjab Naturals';f=()=>{$('#app').innerHTML=`<section class="wrap pol"><h1>${n}</h1><p>DRAFT: replace with your confirmed policy. Orders are not confirmed until our team confirms availability, delivery charges and the total payable amount.</p></section>`}}
shown=24;f();document.title=t;scrollTo(0,0)}
chrome();render();route();addEventListener('hashchange',route);if(CONFIG.gaId){const s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtag/js?id='+CONFIG.gaId;document.head.append(s);window.dataLayer=[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date);gtag('config',CONFIG.gaId)}})();
</script></body></html>
